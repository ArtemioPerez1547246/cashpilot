version: '3.9'
services:
  cashpilot-api:
    build: ../backend
    container_name: cashpilot-api
    ports:
      - "8000:8000"
    environment:
      - MODEL_PROVIDER=stub
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  cashpilot-ui:
    build: ../frontend
    container_name: cashpilot-ui
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://cashpilot-api:8000
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
